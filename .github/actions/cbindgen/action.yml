name: cbindgen
description: >
  Puts the cbindgen version scripts/build-core.sh pins on PATH, from the cache, or built once
  and cached for the next run. build-core.sh then uses it instead of building its own.
runs:
  using: composite
  steps:
    - name: Read the pinned cbindgen version
      shell: bash
      run: |
        version=$(sed -n 's/^cbindgen_version=\([0-9.]*\)$/\1/p' scripts/build-core.sh)
        if [[ -z $version ]]; then
          echo "::error::scripts/build-core.sh pins no cbindgen_version this action can read."
          exit 1
        fi
        echo "CBINDGEN_VERSION=$version" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ~/.cbindgen
        key: cbindgen-${{ env.CBINDGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install cbindgen --version "$CBINDGEN_VERSION" --locked --root ~/.cbindgen
    # Saved as soon as it is built: a job that fails or is cancelled later still keeps it.
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cbindgen
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - shell: bash
      run: |
        echo "$HOME/.cbindgen/bin" >> "$GITHUB_PATH"
        "$HOME/.cbindgen/bin/cbindgen" --version
