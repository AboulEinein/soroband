name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (fmt, clippy, test)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace

  app:
    name: App (bridge tests, unsigned universal build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -t aarch64-apple-darwin,x86_64-apple-darwin && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          cache-directories: core/target/tools
      - run: xcodebuild -version
      - run: scripts/verify/install-guard.sh
      - run: scripts/build-core.sh
      # Snapshot tests stay local: their rendering depends on the runner's macOS and fonts.
      - run: >
          xcodebuild -project app/Soroband.xcodeproj -scheme Soroband
          -derivedDataPath build/DerivedData -destination "platform=macOS,arch=$(uname -m)"
          test -skip-testing:SorobandTests/SnapshotTests
      - run: >
          xcodebuild -project app/Soroband.xcodeproj -scheme Soroband -configuration Release
          -derivedDataPath build/DerivedData -destination generic/platform=macOS
          ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - run: lipo build/DerivedData/Build/Products/Release/Soroband.app/Contents/MacOS/Soroband -verify_arch arm64 x86_64
