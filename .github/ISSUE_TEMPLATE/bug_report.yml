name: Bug report
description: Something is wrong or measured incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Join a hotspot
        2. Download a 100 MB file in Safari
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Soroband version
      description: The output of `soroband version`, or Settings › About.
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: How it was installed
      options:
        - Release (Soroband.dmg)
        - Built from source (scripts/install.sh)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 27.0.1, Mac model
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
