# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews a pull request once it is marked ready, against any base, so
# stacked milestone PRs are reviewed too. docs/review.md describes the flow.
reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
