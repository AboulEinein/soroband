# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Automatic reviews are disabled. This file is read from the PR's head branch.
# Reviews run only on an explicit user request; see docs/review.md.
# The review logs are left out: scripts/verify/records-lint.py is their check.
reviews:
  path_filters:
    - "!docs/review-retros.md"
    - "!docs/coderabbit-findings.md"
  fail_commit_status: true
  auto_review:
    enabled: false
    drafts: false
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - ".*"
  pre_merge_checks:
    docstrings:
      mode: "off"
